font_family      JetBrainsMono Nerd Font
font_size        9

# include ~/.config/kitty/kitty-themes/themes/TokyoNight_Moon.conf
startup_mode fullscreen

map f11 toggle_fullscreen
window_border_width 10
background_opacity 1
cursor_shape beam
cursor_beam_thickness 2
scrollback_lines 5000

map ctrl+shift+t new_tab
map ctrl+shift+w close_tab

map ctrl+shift+enter new_window
map ctrl+shift+q close_window
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up

map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+j resize_window shorter
map ctrl+alt+k resize_window taller

map ctrl+shift+left  send_text all "\x1b[1;6D"
map ctrl+shift+right send_text all "\x1b[1;6C"

map ctrl+shift+r load_config_file

# Cursor animations
# Tuned to match smear-cursor.nvim's config in nvim/lua/plugins/essential.lua
# (high stiffness + high damping there = fast, tight, no-overshoot smear that
# fires on almost every move, including single-line/char ones)
cursor_trail 3
cursor_trail_decay 0.03 0.08
cursor_trail_start_threshold 1
cursor_shape block
cursor_blink true
include tode/keybinds.kitty.conf
wheel_scroll_multiplier 0.5

# kitty 0.46+ added synthetic momentum (inertial) scrolling for touchpads,
# which keeps scrolling even after fingers. Disable it so scroll
# stops the instant you stop scrolling (needs a full kitty restart, not
# just a config reload, to take effect).
momentum_scroll 0
